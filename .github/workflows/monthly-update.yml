name: Actualización mensual (noticias y transacciones)

on:
  schedule:
    - cron: '0 14 1 * *' # día 1 de cada mes, 14:00 UTC (08:00 CDMX)
  workflow_dispatch:
    inputs:
      deal_industry:
        description: 'Opcional: industria de una nueva transacción (ej. Salud)'
        required: false
      deal_count:
        description: 'Número de transacciones a sumar a esa industria (default 1)'
        required: false
        default: '1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Registrar transacción (si se capturó en el formulario)
        if: ${{ inputs.deal_industry != '' }}
        env:
          DEAL_INDUSTRY: ${{ inputs.deal_industry }}
          DEAL_COUNT: ${{ inputs.deal_count }}
        run: node scripts/add-deal.mjs --industry "$DEAL_INDUSTRY" --count "${DEAL_COUNT:-1}"

      - name: Actualizar noticias de M&A
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-news.mjs

      - name: Validar datos
        run: node scripts/validate-data.mjs

      - name: Abrir Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/actualizacion-mensual
          base: main
          delete-branch: true
          add-paths: public/data/*.json
          commit-message: 'chore(data): actualización mensual de noticias y transacciones'
          title: 'chore(data): actualización mensual de noticias y transacciones'
          body: |
            Actualización automática generada por `.github/workflows/monthly-update.yml`.

            - `public/data/news.json`: noticias recientes de M&A (México/LatAm y mid-market), sin duplicados, máx. 12.
            - `public/data/deals.json`: cifras agregadas por industria; se modifica solo si se capturó una transacción al ejecutar el flujo manualmente.

            Revisa los titulares y haz merge; el sitio se vuelve a publicar automáticamente.
          labels: automated, data
